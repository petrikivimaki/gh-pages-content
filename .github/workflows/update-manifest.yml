name: Update content manifest

on:
  push:
    branches:
      - master
    paths:
      - "notes/**/*.md"
      - "notes/**/*.mdx"
      - "images/**"
      - "scripts/generate-content-manifest.mjs"
      - ".github/workflows/update-manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out content
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate manifest
        run: node scripts/generate-content-manifest.mjs --content-root notes --output manifest.json --revision "$GITHUB_SHA"

      - name: Commit updated manifest
        run: |
          # Stage first so the comparison includes a newly created manifest.
          git add -- manifest.json
          if git diff --cached --quiet -- manifest.json; then
            echo "Manifest is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update content manifest"
          git push
